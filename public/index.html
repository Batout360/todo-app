<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Task Master</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Task Master</h1>
            <div class="user-info">
                <div class="avatar-container">
                    <img id="userAvatar" src="https://ui-avatars.com/api/?name=User" alt="Avatar" class="avatar">
                    <input type="file" id="avatarInput" accept="image/*" style="display: none;">
                </div>
                <div class="stats-bar">
                    <span id="userLevel">Lvl 1</span>
                    <div class="xp-progress">
                        <div id="xpFill" style="width: 0%"></div>
                    </div>
                    <span id="userXp">0 XP</span>
                </div>
                <span id="displayUsername"></span>
                <button id="themeToggle" class="icon-btn" title="Toggle Theme">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M12,18C11.11,18 10.26,17.8 9.5,17.45C11.56,16.5 13,14.42 13,12C13,9.58 11.56,7.5 9.5,6.55C10.26,6.2 11.11,6 12,6A6,6 0 0,1 18,12A6,6 0 0,1 12,18M20,8.69V4H15.31L12,0.69L8.69,4H4V8.69L0.69,12L4,15.31V20H8.69L12,23.31L15.31,20H20V15.31L23.31,12L20,8.69Z" />
                    </svg>
                </button>
                <button id="logoutBtn" class="icon-btn" title="Logout">
                    <svg viewBox="0 0 24 24" width="20" height="20">
                        <path fill="currentColor" d="M16,17V14H9V10H16V7L21,12L16,17M14,2A2,2 0 0,1 16,4V6H14V4H5V20H14V18H16V20A2,2 0 0,1 14,22H5A2,2 0 0,1 3,20V4A2,2 0 0,1 5,2H14Z" />
                    </svg>
                </button>
            </div>
        </header>

        <div class="input-group" id="inputContainer">
            <div class="input-row">
                <input type="text" id="taskInput" placeholder="Add a new task..." aria-label="New task">
                <button id="addBtn">Add</button>
            </div>
            <div class="options-row">
                <label class="toggle-label">
                    <input type="checkbox" id="publicToggle">
                    <span>Share with others</span>
                </label>
            </div>
        </div>

        <div class="tabs">
            <button class="tab active" data-tab="my">My Tasks</button>
            <button class="tab" data-tab="public">Public Feed</button>
            <button class="tab" data-tab="friends">Friends</button>
        </div>

        <div id="friendsContainer" style="display: none;">
            <div class="search-box">
                <input type="text" id="friendSearch" placeholder="Search users by name...">
                <div id="searchResults" class="search-results"></div>
            </div>
            <div id="pendingRequests" class="pending-requests" style="display: none;">
                <h4>Pending Requests</h4>
                <div id="requestsList"></div>
            </div>
            <div id="friendsList" class="friends-list"></div>
        </div>

        <ul id="taskList"></ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
